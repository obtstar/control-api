openapi: 3.1.0
info:
  title: control-api (control-web MVP subset)
  description: |
    control-web 审批工作台 MVP 所需的最小 API 契约。
    来源：TASK-002 设计产物；编码阶段复制到 control-api/docs/api/openapi.yaml。
  version: 0.1.0-dev

servers:
  - url: /api
    description: 通过 Vite dev proxy 转发到 control-api 127.0.0.1:8765

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      summary: 用户登录
      description: 校验用户名/密码，返回 Bearer token 与用户信息。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks:
    get:
      summary: 任务列表
      description: 返回所有任务索引，按 updated_at 倒序。
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: 创建任务
      description: |
        创建任务 = 在 tasks/ 下落一份 task.md（文档即任务），初始状态 pending、stage 为空。
        任务 ID 由后端按 TASK-%03d 递增分配。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTaskResponse'
        '400':
          description: 请求格式错误或 title/body 缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{id}/action:
    post:
      summary: 任务动作
      description: |
        对指定任务执行动作：approve 推进到下一阶段，reject 按 pipeline on_reject 回退，
        pause 暂停（最高运行时权限，任何角色可触发），resume 恢复（仅人执行）。
        reject 必须附批注；approve/reject 后端会再次校验角色权限。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: 动作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 当前角色无权审批该阶段
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 状态冲突（如任务不在 awaiting_approval）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /approvals/pending:
    get:
      summary: 当前用户可审批列表
      description: |
        返回当前登录用户角色可审批的 awaiting_approval 任务。
        admin 角色返回全部；其他角色只返回 role 匹配的记录。
      responses:
        '200':
          description: 可审批列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingApproval'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /audit:
    get:
      summary: 审计日志链
      description: 返回工作日志链，按时间倒序，默认最多 100 条。
      responses:
        '200':
          description: 审计日志列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        登录接口返回的会话 token：32 字节加密随机数的 hex 编码（64 字符），
        不透明（非 JWT），有效期 24h。后续请求以 Authorization: Bearer <token> 发送。

  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          description: 密码
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Bearer token
        username:
          type: string
          description: 登录用户名
        role:
          type: string
          enum: [customer, designer, tester, team, admin]
          description: 用户角色
      required:
        - token
        - username
        - role

    Task:
      type: object
      properties:
        task_id:
          type: string
          description: 任务 ID，如 TASK-001
        title:
          type: string
          description: 任务标题
        repo_key:
          type: [string, "null"]
          description: 目标仓库键
        stage:
          type: string
          description: 当前阶段
        status:
          type: string
          enum: [pending, running, awaiting_approval, paused, delivered]
          description: |
            任务状态。实现中不存在 merged 状态赋值点（merge 阶段终审为团队在
            Git 平台合并，见 FINDING-003 另行跟踪），故契约不含 merged。
        authority:
          type: string
          description: 文档权柄级别
        updated_by:
          type: [string, "null"]
          description: 最近更新人（从 work_log 派生）
        updated_at:
          type: string
          format: date-time
          description: 最近更新时间
      required:
        - task_id
        - title
        - stage
        - status
        - authority
        - updated_at

    CreateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: 任务标题（必填，去空白后非空）
        repo_key:
          type: string
          description: 目标仓库键（可选，registry/repos.yaml 中的 key）
        domain:
          type: string
          description: 领域 skill（可选，如 frontend-dev/backend-java）
        body:
          type: string
          description: 需求正文（L1，人写；必填，去空白后非空）
      required:
        - title
        - body

    CreateTaskResponse:
      type: object
      properties:
        task_id:
          type: string
          description: 分配的任务 ID，如 TASK-001
        path:
          type: string
          description: 任务目录路径（task.md 所在目录）
      required:
        - task_id
        - path

    ActionRequest:
      type: object
      properties:
        action:
          type: string
          enum: [approve, reject, pause, resume]
          description: |
            任务动作。approve 批准并推进到下一阶段，reject 按 pipeline on_reject 回退（必须附批注）；
            pause 暂停——最高运行时权限，任何角色可触发，暂停期间禁止一切写操作；
            resume 恢复——仅人执行，恢复后按当前 stage 重新执行。
            advance 仅供后端内部自动流程使用，不对外暴露。
        comment:
          type: [string, "null"]
          description: 批注；reject 时必填
      required:
        - action

    ActionResponse:
      type: object
      properties:
        task_id:
          type: string
          description: 任务 ID
        stage:
          type: string
          description: 动作后阶段
        status:
          type: string
          description: 动作后状态
      required:
        - task_id
        - stage
        - status

    PendingApproval:
      type: object
      properties:
        task_id:
          type: string
          description: 任务 ID
        title:
          type: string
          description: 任务标题
        stage:
          type: string
          description: 待审批阶段
        role:
          type: string
          enum: [customer, designer, tester, team, admin]
          description: 该审批项所需角色
        artifact:
          type: [string, "null"]
          description: 阶段产物摘要或路径
        created_at:
          type: string
          format: date-time
          description: 进入待审批时间
      required:
        - task_id
        - title
        - stage
        - role
        - created_at

    AuditLog:
      type: object
      properties:
        id:
          type: integer
          description: 日志自增 ID
        task_id:
          type: [string, "null"]
          description: 关联任务 ID
        stage:
          type: [string, "null"]
          description: 关联阶段
        action:
          type: string
          description: 动作类型
        operator:
          type: string
          description: 操作人
        model:
          type: [string, "null"]
          description: 使用模型
        detail:
          type: [string, "null"]
          description: 详情
        entry_hash:
          type: string
          description: 日志条目哈希
        created_at:
          type: string
          format: date-time
          description: 创建时间
      required:
        - id
        - action
        - operator
        - entry_hash
        - created_at

    Error:
      type: object
      properties:
        error:
          type: string
          description: 错误信息
      required:
        - error
